[package]
name = "mintool"
version = "0.2.1"
edition = "2021"
rust-version = "1.92"
description = "A lightweight, terminal-first project workspace"

[dependencies]
anyhow = "1"
notify = { version = "8.2", default-features = false }
adabraka-ui = { version = "=0.3.9", default-features = false }
gpui = { package = "adabraka-gpui", version = "=0.5.1" }
portable-pty = "0.9"
vt100 = "0.18"
vte = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
gpui-component = { path = "vendor/gpui-component" }
gpui-component-assets = { path = "vendor/gpui-component-assets" }
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "dds", "exr", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
postgres = "0.19"
rusqlite = { version = "0.42", features = ["bundled"] }
raw-window-handle = "0.6"
x11rb = "0.13"
x11-clipboard = "0.9"
libc = "=0.2.186"

[dev-dependencies]
xim-ctext = "=0.3.0"

[profile.release]
strip = true

[patch.crates-io]
adabraka-gpui = { path = "vendor/adabraka-gpui" }
xim-ctext = { path = "vendor/xim-ctext" }
zed-xim = { path = "vendor/zed-xim" }
